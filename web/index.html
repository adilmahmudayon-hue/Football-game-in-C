<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Shootout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="900" height="560"></canvas>
    <button id="quitBtn">Quit level (Esc)</button>
    <div id="ui"></div>
  </div>
    <div id="touch">
    <div class="dpad">
      <button data-key="ArrowUp" style="grid-column:2;grid-row:1">&#9650;</button>
      <button data-key="ArrowLeft" style="grid-column:1;grid-row:2">&#9664;</button>
      <button data-key="ArrowDown" style="grid-column:2;grid-row:2">&#9660;</button>
      <button data-key="ArrowRight" style="grid-column:3;grid-row:2">&#9654;</button>
    </div>
    <button id="actBtn" data-key="Enter">LOCK /<br>SHOOT</button>
  </div>
    <div id="bot">
    <img id="botImg" src="sticker5.png" alt="Helper">
    <div id="botBubble"></div>
  </div>
  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script src="menu.js"></script>
</body>
</html>
